/* ---------- accordion mechanics ---------- */
function setFold(f, show, animate){
  if (!f) return;
  const target = show ? f.firstElementChild.offsetHeight : 0;
  if (!animate) {
    f.style.transition = 'none';
    f.style.height = target + 'px';
    requestAnimationFrame(() => { f.style.transition = ''; });
  } else {
    f.style.height = target + 'px';
  }
}
function syncFolds(card, animate){
  const editing = card.classList.contains('is-editing');
  const open = card.classList.contains('is-open');
  /* editing keeps the compact row — person and money stay on screen above the form */
  setFold(card.querySelector('.fold-collapsed'), editing || !open, animate);
  setFold(card.querySelector('.fold-expanded'),  !editing && open, animate);
  setFold(card.querySelector('.fold-edit'),      editing,          animate);
}
const syncAll = animate => document.querySelectorAll('.card').forEach(c => syncFolds(c, animate));

/* ==========================================================================
   Edit mode
   ========================================================================== */
function enterEdit(pid){
  if (EDITING) return;
  POS = POSITIONS.find(p => p.pid === pid);
  session = {};
  sessionComment = '';
  /* one month for the session, Sep 2026 by default, never past someone else's transfer */
  const foreign = POS.existingChanges.filter(c => c.field === 'team').map(c => c.applyFrom).sort()[0];
  sessionMonth = (foreign && foreign < DEFAULT_APPLY) ? foreign : DEFAULT_APPLY;
  Object.keys(nodes).forEach(k => delete nodes[k]);
  EDITING = pid;

  const card = $(`.card[data-pid="${pid}"]`);
  card.classList.remove('is-open');
  card.classList.add('is-editing');
  document.body.classList.add('is-editing');

  renderForm(card.querySelector('[data-edit-root]'));
  refresh();
  syncAll(true);
  requestAnimationFrame(() => card.scrollIntoView({ block: 'start', behavior: 'smooth' }));
  updateBackBtn();
}

function exitEdit(){
  const card = EDITING && $(`.card[data-pid="${EDITING}"]`);
  EDITING = null; POS = null; session = {}; sessionComment = '';
  Object.keys(nodes).forEach(k => delete nodes[k]);
  document.body.classList.remove('is-editing');
  if (card) {
    card.classList.remove('is-editing');
    card.querySelector('[data-edit-root]').innerHTML = '';
    card.querySelector('[data-effect]').hidden = true;
  }
  syncAll(true);
  updateBackBtn();
}

/* ---------- what the changes do to the money, in place of the Budget / Fact columns ---------- */
function renderMoneyEffect(){
  const card = EDITING && $(`.card[data-pid="${EDITING}"]`);
  if (!card) return;
  const box = card.querySelector('[data-effect]');
  if (!box) return;
  box.hidden = false;
  const cur = horizonVal('currency');
  const budget = budgetTotal();
  const fact = factTotal();
  const rf = reforecastTotal();

  /* the reforecast is read against the plan — the same comparison the filter names */
  const d = Math.round(rf - budget);
  const dir = d === 0 ? '' : d > 0 ? 'over' : 'good';
  const pct = budget ? Math.abs(d / budget * 100) : 0;
  const sub = d === 0
    ? 'same as budget'
    : (d > 0 ? '↑ +' : '↓ −') + cash(Math.abs(d), cur) + ' · ' + pct.toFixed(1) + '% vs budget';

  /* the reforecast keeps its delta on the same line as the number */
  const tile = (label, value, subLine) => `
    <div class="fx-t">
      <p class="fx-l">${label}</p>
      <p class="fx-v${subLine && dir ? ' ' + dir : ''}">
        <span>${value}</span>
        ${subLine ? `<span class="fx-s${dir ? ' ' + dir : ''}">${subLine}</span>` : ''}
      </p>
    </div>`;

  box.innerHTML =
      tile('Budget', cash(budget, cur))
    + tile('Fact', fact === null ? '—' : cash(fact, cur))
    + tile('Forecast', cash(forecastTotal(), cur))
    + tile('Reforecast · ' + fmtM(META.horizonEnd), cash(rf, cur), sub);
}

/* ---------- Back to edit — the open form can be scrolled far out of the list ---------- */
/** The button shows as soon as no part of the open form is left on screen. */
function updateBackBtn(){
  const btn = $('#back-to-edit');
  const card = EDITING && $(`.card[data-pid="${EDITING}"]`);
  const vh = window.innerHeight || document.documentElement.clientHeight;
  if (!card || !vh) { btn.hidden = true; return; }
  const r = card.querySelector('.fold-edit').getBoundingClientRect();
  btn.hidden = r.bottom > 72 && r.top < vh - 72;
}
window.addEventListener('scroll', updateBackBtn, { passive: true });
window.addEventListener('resize', updateBackBtn);
$('#back-to-edit').onclick = () => {
  const card = EDITING && $(`.card[data-pid="${EDITING}"]`);
  if (card) card.scrollIntoView({ block: 'start', behavior: 'smooth' });
};

/* ---------- form ---------- */
function renderForm(root){
  root.innerHTML = '';
  /* the form on the left, the changes panel on the right — both inside the card */
  const main = el('div', 'edit-main');
  const side = el('div', 'edit-side');
  const panel = el('div', 'chg-panel'); panel.dataset.panel = '';
  side.appendChild(panel);
  root.appendChild(main); root.appendChild(side);

  /* one month for the whole session, instead of a picker on every field */
  const mrow = el('div', 'month-row');
  mrow.appendChild(el('span', 'ml', 'All changes apply from'));
  const mSel = el('select', 'inp');
  fillMonths(mSel, foreignTransferMonth());
  mSel.value = sessionMonth;
  mSel.onchange = () => setSessionMonth(mSel.value);
  mrow.appendChild(mSel);
  mrow.appendChild(el('span', 'mn', 'Every value you change below takes effect from this month and stays until the next change.'));
  main.appendChild(mrow);
  nodes.sessionMonth = { sel: mSel };

  /* every section starts closed — you open the one you came to change */
  SECTIONS.forEach(s => {
    const sec = el('div', 'esec'); sec.id = 'sec-' + s.id;

    const h = el('button', 'esec-h'); h.type = 'button';
    const cap = el('span', 'cap');
    cap.appendChild(el('span', 'n', ''));   // numbered at refresh — Hiring comes and goes
    cap.appendChild(document.createTextNode(s.title));
    const count = el('span', 'esec-count');
    count.style.display = 'none';
    h.appendChild(cap); h.appendChild(count); h.appendChild(el('span', 'rule'));
    h.insertAdjacentHTML('beforeend', ICON('chevron-down-sec', 16).replace('class="icon"', 'class="icon chev"'));
    h.onclick = () => {
      sec.classList.toggle('is-open');
      const card = sec.closest('.card');
      if (card) syncFolds(card, true);
    };
    sec.appendChild(h);

    const body = el('div', 'esec-body');
    const grid = el('div', 'egrid');
    if (s.id === 'profile') buildProfileSection(grid);
    FIELDS.filter(f => f.s === s.id).forEach(f => grid.appendChild(buildField(f)));
    body.appendChild(grid);
    sec.appendChild(body);
    main.appendChild(sec);
  });
}

/** Move the whole session to another month. */
function setSessionMonth(m){
  sessionMonth = m;
  const temporaryOn = nodes.makeTemporary && nodes.makeTemporary.cb.checked;
  Object.keys(session).forEach(k => {
    if (F[k] && F[k].noApply) return;
    // the temporary end month is a date of its own, not the apply month
    if (k === 'deactivation' && temporaryOn) return;
    session[k].applyFrom = m;
    if (k === 'deactivation') session[k].to = m;
  });
  refresh();
}

function fieldRow(key, label, oq, wide){
  const row = el('div', 'efld' + (wide ? ' wide' : '')); row.id = 'f-' + key;
  const l = el('div', 'lbl');
  l.appendChild(document.createTextNode(label));
  if (oq) { const b = el('span', 'oq', '?' + oq); b.title = OPEN_Q[oq]; l.appendChild(b); }
  const c = el('div', 'efld-c');
  row.appendChild(l); row.appendChild(c);
  return { row, control: c };
}

/* No month here any more — the session carries one, above the sections.
   Revert is a bin next to the control, shown only once the field is changed. */
function attachMeta(key, control){
  const ctrl = control.firstElementChild;
  const row = el('div', 'ctrl-row');
  control.insertBefore(row, ctrl);
  row.appendChild(ctrl);

  const revert = el('button', 'revert');
  revert.type = 'button';
  revert.title = 'Revert this field';
  revert.setAttribute('aria-label', 'Revert this field');
  revert.innerHTML = ICON('trash', 16);
  revert.onclick = () => revertField(key);
  row.appendChild(revert);

  const meta = el('div', 'emeta');
  const hint = el('span', 'ehint');
  const calc = el('span', 'ecalc');
  meta.appendChild(calc); meta.appendChild(hint);
  control.appendChild(meta);
  return { meta, revert, hint, calc };
}

function buildField(f){
  const { row, control } = fieldRow(f.k, f.label, f.oq, f.wide);
  const v = attr(f.k);
  let input = null;

  if (f.type === 'select') {
    input = el('select', 'inp');
    if (f.placeholder || v === null) {
      const o = el('option', '', f.placeholder || '— not set —'); o.value = '';
      input.appendChild(o);
    }
    f.opts().forEach(x => { const o = el('option', '', x); o.value = x; input.appendChild(o); });
    input.value = v == null ? '' : v;
    input.onchange = () => setVal(f.k, input.value === '' ? null : input.value);
    control.appendChild(input);

  } else if (f.type === 'radio') {
    const g = el('div', 'radios');
    f.opts().forEach(x => {
      const lab = el('label');
      const r = el('input'); r.type = 'radio'; r.name = 'r-' + f.k; r.value = x; r.checked = v === x;
      r.onchange = () => setVal(f.k, x);
      lab.appendChild(r); lab.appendChild(el('span', '', x));
      g.appendChild(lab);
      if (!input) input = r;
    });
    control.appendChild(g);

  } else if (f.type === 'number') {
    input = el('input', 'inp'); input.type = 'number'; input.value = v == null ? '' : v;
    input.placeholder = f.ph || '0';
    input.oninput = () => setVal(f.k, input.value === '' ? null : Number(input.value));
    control.appendChild(input);

  } else if (f.type === 'check') {
    const wrap = el('div', 'chk'); const lab = el('label');
    input = el('input'); input.type = 'checkbox'; input.checked = !!v;
    input.onchange = () => setVal(f.k, input.checked);
    lab.appendChild(input); lab.appendChild(el('span', '', 'Yes'));
    wrap.appendChild(lab); control.appendChild(wrap);

  } else if (f.type === 'month') {
    input = el('select', 'inp');
    const o0 = el('option', '', '— not set —'); o0.value = ''; input.appendChild(o0);
    monthList('2026-01', META.horizonEnd).forEach(m => { const o = el('option', '', fmtM(m)); o.value = m; input.appendChild(o); });
    input.value = v || '';
    input.onchange = () => setVal(f.k, input.value || null);
    control.appendChild(input);

  } else if (f.type === 'textarea') {
    input = el('textarea', 'inp'); input.value = v || '';
    input.oninput = () => setVal(f.k, input.value || null);
    control.appendChild(input);

  } else if (f.type === 'team') {
    input = el('select', 'inp');
    REFS.teams.forEach(t => {
      const shared = REFS.teams.filter(x => x.manager.pid === t.manager.pid).length > 1;
      const o = el('option', '', t.manager.name + (shared ? ' — ' + t.team : ''));
      o.value = t.team; input.appendChild(o);
    });
    input.value = v;
    input.onchange = () => setVal(f.k, input.value);
    control.appendChild(input);
  }

  const n = { row, input };
  Object.assign(n, attachMeta(f.k, control));
  nodes[f.k] = n;
  return row;
}

/* ---------- section 1: profile and status ---------- */
function buildProfileSection(grid){
  const sec = grid;
  const ACTIONS = POS.state === 'closed'
    ? [{ id: 'change', label: 'Change profile', cbText: 'Move another person onto the position', person: true,
         effect: 'Another person takes the position from the month you pick. It stays closed and the field set does not change.' },
       { id: 'remove', label: 'Remove profile', cbText: 'Take the person off the position', person: false,
         effect: 'The position becomes an open vacancy from the month you pick. Grade, Priority and Hiring appear, Raise stops.' }]
    : [{ id: 'set', label: 'Set profile', cbText: 'Put a person on the position', person: true,
         effect: 'A person takes the open position from the month you pick. It becomes closed, Raise appears, Hiring goes.' }];

  const paList = ACTIONS.map(a => {
    const r = fieldRow('pa-' + a.id, a.label, null, true);
    const wrap = el('div', 'emeta'); wrap.style.marginTop = '0';
    const cb = el('input'); cb.type = 'checkbox';
    const lab = el('label');
    lab.appendChild(cb); lab.appendChild(el('span', '', a.cbText));
    wrap.appendChild(lab);

    let pSel = null;
    if (a.person) {
      pSel = el('select', 'inp inp-sm');
      const p0 = el('option', '', '— pick a person —'); p0.value = ''; pSel.appendChild(p0);
      PEOPLE.forEach(p => { const o = el('option', '', p); o.value = p; pSel.appendChild(o); });
      wrap.appendChild(pSel);
    }

    const hint = el('span', 'ehint');
    wrap.appendChild(hint);
    r.control.appendChild(wrap);
    r.control.appendChild(el('div', 'effect', a.effect));

    const write = () => {
      session.profileAction = { to: a.id, target: pSel ? (pSel.value || null) : null, applyFrom: sessionMonth };
      refresh();
    };
    cb.onchange = () => {
      if (cb.checked) write();
      else { if (session.profileAction && session.profileAction.to === a.id) delete session.profileAction; refresh(); }
    };
    if (pSel) pSel.onchange = () => { cb.checked = true; write(); };

    sec.appendChild(r.row);
    return { id: a.id, person: a.person, row: r.row, cb, pSel, hint };
  });

  nodes.profileAction = {
    list: paList,
    get active() { const cur = session.profileAction && session.profileAction.to; return paList.find(a => a.id === cur) || paList[0]; },
    get row() { return this.active.row; },
    get input() { return this.active.cb; }
  };

  /* transfer — the same change as Direct manager, surfaced where it is looked for */
  const tr = fieldRow('transfer', 'Transfer', 1, true);
  const trWrap = el('div', 'emeta'); trWrap.style.marginTop = '0';
  const trCb = el('input'); trCb.type = 'checkbox';
  const trLab = el('label'); trLab.appendChild(trCb); trLab.appendChild(el('span', '', 'Move to another manager'));
  const trSel = el('select', 'inp inp-sm');
  const tr0 = el('option', '', '— pick a manager —'); tr0.value = ''; trSel.appendChild(tr0);
  REFS.teams.forEach(t => {
    const shared = REFS.teams.filter(x => x.manager.pid === t.manager.pid).length > 1;
    const o = el('option', '', t.manager.name + (shared ? ' — ' + t.team : ''));
    o.value = t.team; trSel.appendChild(o);
  });
  const trHint = el('span', 'ehint');
  trWrap.appendChild(trLab); trWrap.appendChild(trSel); trWrap.appendChild(trHint);
  tr.control.appendChild(trWrap);
  tr.control.appendChild(el('div', 'effect',
    'The position moves to another manager from this month. Your budget keeps it, the fact goes to them, '
    + 'and after saving you can no longer open this page. No way back from here.'));

  trCb.onchange = () => { if (!trCb.checked) { delete session.team; syncControl('team'); } refresh(); };
  trSel.onchange = () => {
    if (!trSel.value) delete session.team;
    else setVal('team', trSel.value);
    refresh();
  };
  nodes.transfer = { row: tr.row, input: trCb, cb: trCb, sel: trSel, hint: trHint };
  sec.appendChild(tr.row);

  /* deactivation */
  const dz = fieldRow('deactivation', 'Deactivation', 2, true);
  const wrap = el('div', 'emeta'); wrap.style.marginTop = '0';
  const cb = el('input'); cb.type = 'checkbox';
  const lab = el('label'); lab.appendChild(cb); lab.appendChild(el('span', '', 'Switch the position off'));
  const dWhen = el('span', 'ehint');
  cb.onchange = () => {
    if (cb.checked) session.deactivation = { to: sessionMonth, applyFrom: sessionMonth };
    else delete session.deactivation;
    refresh();
  };
  wrap.appendChild(lab); wrap.appendChild(dWhen);
  dz.control.appendChild(wrap);
  dz.control.appendChild(el('div', 'effect',
    'No budget from this month to the end of the horizon. The position is not deleted — clear the box '
    + 'and it comes back. Bringing it back after saving is open question 2.'));
  nodes.deactivation = { row: dz.row, input: cb, cb, when: dWhen };
  sec.appendChild(dz.row);

  /* make temporary */
  const mt = fieldRow('makeTemporary', 'Temporary position', null, true);
  const isOpen = POS.state === 'open';
  const mtWrap = el('div', 'emeta'); mtWrap.style.marginTop = '0';
  const mtCb = el('input'); mtCb.type = 'checkbox';
  const mtLab = el('label'); mtLab.appendChild(mtCb);
  mtLab.appendChild(el('span', '', 'Fill for a period, then switch off'));
  const pSel = el('select', 'inp inp-sm');
  const p0 = el('option', '', isOpen ? '— pick a person —' : '— keep the current person —'); p0.value = '';
  pSel.appendChild(p0);
  PEOPLE.forEach(p => { const o = el('option', '', p); o.value = p; pSel.appendChild(o); });
  /* the start is the session month; only the end is a date of its own */
  const DEFAULT_END = MONTHS[Math.min(MONTHS.indexOf(sessionMonth) + 6, MONTHS.length - 1)];
  const tWrap = el('span', 'apply');
  tWrap.appendChild(el('span', '', 'until'));
  const tSel3 = el('select', 'inp inp-sm'); fillMonths(tSel3, foreignTransferMonth()); tSel3.value = DEFAULT_END;
  tWrap.appendChild(tSel3);
  const mtHint = el('span', 'ehint');
  mtWrap.appendChild(mtLab); mtWrap.appendChild(pSel);
  mtWrap.appendChild(tWrap); mtWrap.appendChild(mtHint);
  mt.control.appendChild(mtWrap);
  mt.control.appendChild(el('div', 'effect',
    'A shortcut for two changes at once: the profile event at the session month and the deactivation at the end one. '
    + 'Nothing is deleted — the position simply carries no budget after the end month.'));

  const writeTemp = () => {
    if (pSel.value) session.profileAction = { to: isOpen ? 'set' : 'change', target: pSel.value, applyFrom: sessionMonth };
    else if (session.profileAction && session.profileAction.to !== 'remove') delete session.profileAction;
    session.deactivation = { to: tSel3.value, applyFrom: tSel3.value };
    refresh();
  };
  mtCb.onchange = () => {
    if (mtCb.checked) session.deactivation = { to: tSel3.value, applyFrom: tSel3.value };
    else {
      delete session.deactivation;
      if (session.profileAction && session.profileAction.to !== 'remove') delete session.profileAction;
      pSel.value = '';
    }
    refresh();
  };
  pSel.onchange = writeTemp;
  tSel3.onchange = writeTemp;
  nodes.makeTemporary = { row: mt.row, input: mtCb, cb: mtCb, pSel, tSel3, tWrap, hint: mtHint, isOpen };
  sec.appendChild(mt.row);
}

/* ==========================================================================
   Edits
   ========================================================================== */
function setVal(k, v){
  const base = attr(k);
  const same = (base === v) || (base == null && (v === null || v === ''));
  if (same) delete session[k];
  else if (isChanged(k)) session[k].to = v;
  else session[k] = { to: v, applyFrom: F[k].noApply ? null : sessionMonth };
  refresh();
}

function revertField(k){
  delete session[k];
  syncControl(k);
  refresh();
}

function syncControl(k){
  const n = nodes[k], f = F[k];
  if (!n) return;
  const v = attr(k);
  if (k === 'deactivation') { n.cb.checked = false; return; }
  if (k === 'profileAction') {
    n.list.forEach(a => { a.cb.checked = false; if (a.pSel) a.pSel.value = ''; });
    return;
  }
  if (!f) return;
  if (f.type === 'radio') {
    n.row.querySelectorAll('input[type=radio]').forEach(r => { r.checked = (r.value === v); });
  } else if (f.type === 'check') { n.input.checked = !!v; }
  else if (n.input) { n.input.value = v == null ? '' : v; }
}

/* ==========================================================================
   Refresh
   ========================================================================== */
function refresh(){
  refreshFields();
  renderPanel();
  const card = EDITING && $(`.card[data-pid="${EDITING}"]`);
  if (card) syncFolds(card, true);
}

function refreshFields(){
  const currencySet = formVal('currency') != null;
  const totalBefore = forecastTotal();
  const blk = firstBlocker();

  FIELDS.forEach(f => {
    const n = nodes[f.k]; if (!n) return;
    const visible = fieldVisible(f);
    const orphan = fieldOrphaned(f);
    n.row.style.display = visible ? '' : 'none';
    n.row.classList.toggle('is-orphan', orphan);

    if (n.input && !n.input.matches('[type=radio]')) {
      n.input.disabled = orphan || (f.needsCurrency && !currencySet);
    }
    if (f.k === 'team' && n.input) n.input.value = formVal('team');
    if (f.type === 'radio') {
      n.row.querySelectorAll('input[type=radio]').forEach(r => { r.disabled = orphan; });
    }

    const ch = isChanged(f.k);
    n.row.classList.toggle('is-changed', ch);
    n.revert.style.display = ch ? '' : 'none';

    const blocked = ch && !f.noApply && blk && !STRUCTURAL.includes(f.k)
                    && session[f.k].applyFrom >= blk.month;
    n.row.classList.toggle('after-tr', !!blocked);

    if (n.hint) {
      n.hint.textContent =
          blocked ? 'From ' + fmtM(blk.month) + ' ' + blk.text + ' — this change will not apply'
        : orphan ? 'The position has no profile from ' + fmtM(session.profileAction.applyFrom)
                 + ' — this change stops at ' + fmtM(prevMonth(session.profileAction.applyFrom))
        : (f.needsCurrency && !currencySet) ? 'Choose currency first'
        : (ch && f.noApply) ? 'No apply month on this field — it is a date, not a value'
        : (f.stub) ? 'No values for this field in fixtures.json yet'
        : (f.note) ? f.note
        : '';
    }

    if (n.calc) {
      n.calc.textContent = (ch && f.pay)
        ? 'Total ' + num(totalBefore) + ' → ' + num(reforecastTotal()) + ' (tax included)'
        : '';
    }
  });

  renderMoneyEffect();
  requestAnimationFrame(updateBackBtn);   // the form just changed height

  let secNo = 0;
  SECTIONS.forEach(s => {
    const sec = $('#sec-' + s.id); if (!sec) return;
    const any = [...sec.querySelectorAll('.efld')].some(r => r.style.display !== 'none');
    sec.style.display = any ? '' : 'none';
    // only the sections on screen are counted, so the numbers never skip
    sec.querySelector('.cap .n').textContent = any ? (++secNo) + '.' : '';
    // a closed section still says how much of yours sits inside it
    const n = [...sec.querySelectorAll('.efld.is-changed')].filter(r => r.style.display !== 'none').length;
    const badge = sec.querySelector('.esec-count');
    if (badge) { badge.textContent = n ? n : ''; badge.style.display = n ? '' : 'none'; }
  });

  const pn = nodes.profileAction;
  const trM = transferMonth();
  if (pn) {
    const pa = session.profileAction;
    pn.list.forEach(a => {
      const on = !!pa && pa.to === a.id;
      a.cb.checked = on;
      a.row.classList.toggle('is-changed', on);
      if (a.pSel) {
        a.pSel.style.display = on ? '' : 'none';
        if (on) a.pSel.value = pa.target || '';
      }
      a.hint.textContent = (on && a.person && !pa.target) ? 'Pick the person who takes the position'
        : on ? 'From ' + fmtM(pa.applyFrom) : '';
      a.row.classList.toggle('after-tr', !!(on && trM && pa.applyFrom > trM));
    });
  }

  const tn = nodes.transfer;
  if (tn) {
    const on = isChanged('team');
    if (on) { tn.cb.checked = true; tn.sel.value = session.team.to; }
    tn.row.classList.toggle('is-changed', on);
    tn.sel.style.display = tn.cb.checked ? '' : 'none';
    tn.hint.textContent = !tn.cb.checked ? ''
      : !on ? 'Pick the manager this position moves to'
      : 'From ' + fmtM(session.team.applyFrom);
  }

  const flagTr = (node, key) => node && node.row.classList.toggle('after-tr',
    !!(isChanged(key) && trM && session[key].applyFrom > trM));

  const dn = nodes.deactivation;
  if (dn) {
    const on = isChanged('deactivation');
    if (on) dn.cb.checked = true;
    dn.row.classList.toggle('is-changed', on);
    flagTr(dn, 'deactivation');
    dn.when.textContent = on ? 'From ' + fmtM(session.deactivation.to) : '';
  }

  const mn = nodes.makeTemporary;
  if (mn) {
    const pa = session.profileAction;
    const paired = pa && pa.to !== 'remove';
    if (isChanged('deactivation') && paired) mn.cb.checked = true;
    mn.row.classList.toggle('is-changed', mn.cb.checked);
    mn.pSel.style.display = mn.cb.checked ? '' : 'none';
    mn.tWrap.style.display = mn.cb.checked ? '' : 'none';
    fillMonths(mn.tSel3, foreignTransferMonth());
    if (paired) mn.pSel.value = pa.target || '';
    else mn.pSel.value = '';
    if (isChanged('deactivation')) mn.tSel3.value = session.deactivation.to;
    mn.hint.textContent = !mn.cb.checked ? ''
      : (mn.isOpen && !mn.pSel.value) ? 'Pick the person who fills it for the period'
      : (mn.tSel3.value <= sessionMonth) ? 'The end month has to be after ' + fmtM(sessionMonth)
      : 'From ' + fmtM(sessionMonth);
  }
}

/* ==========================================================================
   Changes panel
   ========================================================================== */
const asSessionKey = field => field === 'profile.set' ? 'profileAction' : field;
function replacedBy(k){ return POS.existingChanges.find(c => asSessionKey(c.field) === k) || null; }
const sourceOf = c => c.source === 'ticket' ? 'ticket ' + c.ticket.id : roleName(c.author.role);

function changeRows(){
  const rows = [];
  Object.keys(session).forEach(k => {
    const s = session[k];
    const rep = replacedBy(k);
    const note = rep ? 'Replaces ' + sourceOf(rep) + ' change' : '';

    if (k === 'profileAction') {
      const map = {
        remove: ['Remove profile', 'Position becomes open'],
        change: ['Change profile', 'to ' + (s.target || '…')],
        set:    ['Set profile', (s.target || '…') + ' · position becomes closed']
      };
      const [l1, l2] = map[s.to];
      rows.push({ key: k, ord: 0, struct: true, applyFrom: s.applyFrom, l1, l2, note, full: l1 + ' — ' + l2 });
      return;
    }
    if (k === 'deactivation') {
      const t = 'Deactivate from ' + fmtM(s.to);
      rows.push({ key: k, ord: 1, struct: true, applyFrom: s.applyFrom, l1: t, l2: '', note, full: t });
      return;
    }
    const f = F[k];
    const from = fmtVal(k, attr(k));
    const to = fmtVal(k, s.to);
    const body = (attr(k) === null || attr(k) === undefined || attr(k) === '') ? to : from + ' → ' + to;
    const orphanNote = fieldOrphaned(f)
      ? 'effective until ' + fmtM(prevMonth(session.profileAction.applyFrom)) : '';
    rows.push({ key: k, ord: k === 'team' ? 2 : f.ord, struct: k === 'team',
                applyFrom: s.applyFrom, l1: f.label + ':', l2: body,
                cut: k === 'team',
                note: [note, orphanNote].filter(Boolean).join(' · '), full: f.label + ': ' + body });
  });
  return rows;
}

function foreignRows(){
  return POS.existingChanges.map(c => {
    const k = asSessionKey(c.field);
    const src = c.source === 'ticket'
      ? 'ticket ' + c.ticket.id + ' · approved ' + fmtDay(c.ticket.approvedAt)
      : c.author.name + ', ' + roleName(c.author.role) + ' · ' + fmtDay(c.changedAt);
    let l1, l2;
    if (c.field === 'deactivation')      { l1 = 'Deactivate from ' + fmtM(c.to); l2 = ''; }
    else if (c.field === 'profile.set')  { l1 = 'Set profile:'; l2 = String(c.to); }
    else {
      l1 = labelOf(c.field) + ':';
      l2 = (c.from === null || c.from === undefined) ? fmtVal(c.field, c.to)
         : fmtVal(c.field, c.from) + ' → ' + fmtVal(c.field, c.to);
    }
    const struct = STRUCTURAL.includes(k);
    return {
      key: k, ord: struct ? (k === 'profileAction' ? 0 : k === 'deactivation' ? 1 : 2)
                          : (F[c.field] ? F[c.field].ord : 50),
      applyFrom: c.applyFrom, struct,
      other: true, src, overwritten: isChanged(k), cut: c.field === 'team', l1, l2,
      full: (l1 + ' ' + l2).trim()
    };
  });
}

let showOthers = true;

function renderPanel(){
  const card = EDITING && $(`.card[data-pid="${EDITING}"]`);
  const p = card && card.querySelector('[data-panel]');
  if (!p || !POS) return;
  p.innerHTML = '';

  const mine = changeRows();
  const others = foreignRows();

  const scroll = el('div', 'pnl-scroll');

  const h = el('div', 'pnl-h', 'Changes');
  if (mine.length) {
    const dis = el('button', 'link-btn', 'Discard all');
    dis.type = 'button';
    dis.title = 'Remove every edit of yours and keep editing';
    dis.onclick = discardAll;
    h.appendChild(dis);
  }
  scroll.appendChild(h);

  const sum = el('div', 'pnl-sum');
  sum.appendChild(el('span', '', mine.length ? mine.length + ' yours' : 'none of yours yet'));
  if (others.length) {
    sum.appendChild(el('span', '', '·'));
    sum.appendChild(el('span', 'dot-other'));
    sum.appendChild(el('span', '', others.length + ' by other roles'));
    const lab = el('label');
    const cb = el('input'); cb.type = 'checkbox'; cb.checked = showOthers;
    cb.onchange = () => { showOthers = cb.checked; renderPanel(); };
    lab.appendChild(cb); lab.appendChild(el('span', '', 'Show'));
    sum.appendChild(lab);
  }
  scroll.appendChild(sum);

  if (!mine.length) {
    const e = el('div', 'pnl-empty');
    e.appendChild(el('div', '', 'Your edits will appear here.'));
    e.appendChild(el('div', '', 'Click a change to jump to that field.'));
    scroll.appendChild(e);
  }

  const rows = showOthers ? mine.concat(others) : mine;
  if (rows.length) {
    /* the structural changes come first, and everything from their month on is dead weight */
    const blk = firstBlocker();
    const isDead = r => !!(blk && !r.struct && r.applyFrom && r.applyFrom >= blk.month);
    const live = rows.filter(r => !isDead(r));
    const dead = rows.filter(isDead);

    const groups = {};
    live.forEach(r => { const g = r.applyFrom || '~nomonth'; (groups[g] = groups[g] || []).push(r); });
    Object.keys(groups).sort().forEach(g => {
      scroll.appendChild(el('div', 'grp-h', g === '~nomonth' ? 'No month' : 'From ' + fmtM(g)));
      groups[g]
        .sort((a, b) => (a.struct === b.struct)
          ? ((a.other === b.other) ? a.ord - b.ord : (a.other ? 1 : -1))
          : (a.struct ? -1 : 1))
        .forEach(r => {
          scroll.appendChild(chipEl(r, false));
          if (r.cut) scroll.appendChild(cutLine());
        });
    });

    if (dead.length) scroll.appendChild(deadBlock(dead, blk));
  }

  scroll.appendChild(outro());
  p.appendChild(scroll);
  p.appendChild(commentEl());
  p.appendChild(actionsEl());
}

/* A line about why — it travels with the change set. */
function commentEl(){
  const box = el('div', 'pnl-comment');
  const lbl = el('div', 'lbl');
  lbl.appendChild(document.createTextNode('Comment'));
  lbl.appendChild(el('span', 'opt', 'optional'));
  const ta = el('textarea', 'inp');
  ta.placeholder = 'Why these changes — a line for whoever reviews them';
  ta.value = sessionComment;
  ta.oninput = () => { sessionComment = ta.value; };   // no re-render, the caret stays put
  box.appendChild(lbl); box.appendChild(ta);
  return box;
}

function cutLine(){
  const d = el('div', 'cut-line');
  d.appendChild(el('span', '', 'Your timeline ends here'));
  return d;
}

/* Drop a set of your own changes and put their controls back to baseline. */
function dropChanges(keys){
  keys.forEach(k => { delete session[k]; syncControl(k); });
  if (nodes.transfer && !isChanged('team')) nodes.transfer.cb.checked = false;
  if (nodes.deactivation && !isChanged('deactivation')) nodes.deactivation.cb.checked = false;
  if (nodes.makeTemporary && !isChanged('deactivation')) {
    nodes.makeTemporary.cb.checked = false;
    nodes.makeTemporary.pSel.value = '';
  }
  refresh();
}

function deadBlock(rows, blk){
  const box = el('div', 'dead');
  const h = el('div', 'dead-h');
  h.appendChild(el('span', 'dead-mark', '!'));
  h.appendChild(el('span', '', rows.length + (rows.length === 1 ? ' change will not apply' : ' changes will not apply')));

  /* only your own can go from here — another role's change is not yours to drop */
  const mineKeys = rows.filter(r => !r.other).map(r => r.key);
  if (mineKeys.length) {
    const drop = el('button', 'link-btn', 'Discard' + (mineKeys.length > 1 ? ' ' + mineKeys.length : ''));
    drop.type = 'button';
    drop.title = 'Remove the changes that will not apply';
    drop.onclick = () => ask(
      'Discard ' + mineKeys.length + (mineKeys.length === 1 ? ' change' : ' changes') + ' that will not apply?',
      ['They are removed from this session. The change that blocks them stays.',
       'Changes by other roles are not touched.'],
      'Discard', () => dropChanges(mineKeys));
    h.appendChild(drop);
  }
  box.appendChild(h);
  box.appendChild(el('div', 'dead-s',
    'From ' + fmtM(blk.month) + ' ' + blk.text
    + '. Nothing dated from that month on lands in your budget — undo it, or drop these changes.'));

  rows.sort((a, b) => a.applyFrom === b.applyFrom ? a.ord - b.ord : (a.applyFrom < b.applyFrom ? -1 : 1))
    .forEach(r => {
      const node = chipEl(r, true);
      node.classList.add('in-dead');
      box.appendChild(node);
    });
  return box;
}

function outro(){
  const d = el('div', 'pnl-note');
  d.appendChild(el('div', '', 'When you are done, save the changes.'));
  d.appendChild(el('div', '', 'They stay in the list of changed positions, where you can look them over and undo them later.'));
  return d;
}

function discardAll(){
  const n = Object.keys(session).length;
  if (!n) return;
  ask('Discard ' + n + (n === 1 ? ' unsaved change' : ' unsaved changes') + '?',
      ['Your edits are removed and the position stays open for editing.',
       'Changes by other roles are not touched.'],
      'Discard', () => dropChanges(Object.keys(session)));
}

function chipEl(r, withMonth){
  const mine = !r.other;
  const b = el(mine ? 'button' : 'div', 'chg' + (mine ? '' : ' chg-other'));
  if (mine) {
    b.type = 'button';
    b.dataset.field = r.key;
    b.title = r.full + (r.applyFrom ? ' · applies from ' + fmtM(r.applyFrom) : ' · no apply month');
    b.onclick = () => jumpTo(r.key);
  } else {
    b.title = r.full + ' · applies from ' + fmtM(r.applyFrom) + ' · ' + r.src;
  }
  if (withMonth) b.appendChild(el('div', 'chg-when', r.applyFrom ? 'From ' + fmtM(r.applyFrom) : 'No month'));
  b.appendChild(el('div', 'chg-1', r.l1));
  if (r.l2) {
    const l2 = el('div', 'chg-2');
    l2.appendChild(el('span', r.l2.length > 60 ? 'ell' : '', r.l2));
    b.appendChild(l2);
  }
  if (r.struct) {
    b.classList.add('chg-struct');
    b.insertBefore(el('div', 'chg-key', 'Affects the whole position'), b.firstChild);
  }
  if (r.cut) {
    b.classList.add('chg-cut');
    b.appendChild(el('div', 'chg-cut-n', 'The position leaves your budget from this month'));
  }
  if (!mine) b.appendChild(el('div', 'chg-src', r.src));
  const note = mine ? r.note : (r.overwritten ? 'Replaced by your change' : '');
  if (note) b.appendChild(el('div', 'chg-note', note));
  return b;
}

function jumpTo(key){
  // the manager has no field of its own — its chip lands on the Transfer row
  const n = nodes[key] || (key === 'team' ? nodes.transfer : null);
  if (!n) return;
  const sec = n.row.closest('.esec');            // the field may sit in a closed section
  if (sec && !sec.classList.contains('is-open')) {
    sec.classList.add('is-open');
    const card = sec.closest('.card');
    if (card) syncFolds(card, true);
  }
  n.row.scrollIntoView({ block: 'center', behavior: 'smooth' });
  n.row.classList.add('is-hit');
  setTimeout(() => n.row.classList.remove('is-hit'), 1400);
  const focusable = n.input || n.row.querySelector('select, input, textarea, button');
  if (focusable && !focusable.disabled) setTimeout(() => focusable.focus({ preventScroll: true }), 260);
}

function actionsEl(){
  const mine = Object.keys(session).length;
  const others = POS.existingChanges.length;

  const box = el('div', 'pnl-actions');
  const state = el('div', 'pnl-state');
  state.appendChild(el('b', '', mine
    ? mine + (mine === 1 ? ' unsaved change' : ' unsaved changes')
    : 'No changes yet'));
  if (others) {
    state.appendChild(el('span', 'pnl-state-sub',
      others + (others === 1 ? ' change' : ' changes') + ' by other roles stay unchanged'));
  }
  box.appendChild(state);

  const btns = el('div', 'pnl-actions-btns');
  const cancel = el('button', 'btn', 'Cancel');
  cancel.type = 'button';
  cancel.onclick = cancelEdit;
  const save = el('button', 'btn btn-primary', 'Save changes');
  save.type = 'button';
  save.disabled = !mine;
  save.onclick = saveChanges;
  btns.appendChild(cancel); btns.appendChild(save);
  box.appendChild(btns);
  return box;
}

/* ==========================================================================
   Save / Cancel
   ========================================================================== */
function dialog(title, lines){
  $('#dlg-h').textContent = title;
  const b = $('#dlg-b'); b.innerHTML = '';
  lines.forEach(l => b.appendChild(el('div', 'ln', l)));
  $('#dlg-ok').hidden = true;
  $('#dlg-close').textContent = 'Close';
  $('#ovl').hidden = false;
}
function ask(title, lines, okLabel, onOk){
  dialog(title, lines);
  const ok = $('#dlg-ok');
  ok.textContent = okLabel; ok.hidden = false;
  $('#dlg-close').textContent = 'Cancel';
  ok.onclick = () => { $('#ovl').hidden = true; onOk(); };
}
$('#dlg-close').onclick = () => { $('#ovl').hidden = true; };

function saveChanges(){
  const rows = changeRows();
  if (!rows.length) { dialog('Nothing to save', ['No changes in this session.']); return; }
  const groups = {};
  rows.forEach(r => { const g = r.applyFrom || '~nomonth'; (groups[g] = groups[g] || []).push(r); });
  const lines = [];
  Object.keys(groups).sort().forEach(g => {
    lines.push(g === '~nomonth' ? 'No month' : 'From ' + fmtM(g));
    groups[g].forEach(r => lines.push('   ' + r.full));
  });
  lines.push('');
  lines.push(sessionComment.trim()
    ? 'Comment: ' + sessionComment.trim()
    : 'No comment left with this change set.');
  lines.push('');
  lines.push('Save is not wired up in the prototype — this is the payload that would be sent.');
  ask(rows.length + (rows.length === 1 ? ' change' : ' changes') + ' to save', lines, 'Save', applySave);
}

function applySave(){
  const p = POS;
  if (!p.edited) { p.edited = true; EDITED++; }
  exitEdit();
  renderCards();
  updateEdited();
}

function updateEdited(){
  $('#edited-count').textContent = EDITED;
  $('#edited-word').textContent = (EDITED === 1 ? 'position' : 'positions') + ' edited';
  $('#btn-view-edited').classList.toggle('is-off', EDITED === 0);
}

function cancelEdit(){
  const mine = Object.keys(session).length;
  if (!mine) { exitEdit(); return; }
  ask('You have ' + mine + (mine === 1 ? ' unsaved change' : ' unsaved changes') + '. Leave anyway?',
      ['Nothing is saved. You go back to the positions list.'],
      'Leave', exitEdit);
}

/* ==========================================================================
   List interactions
   ========================================================================== */
function bindCards(){
  document.querySelectorAll('.card[data-expandable]').forEach(card => {
    card.querySelector('.card-top').addEventListener('click', e => {
      if (card.classList.contains('is-editing')) return;   // other cards still open while one is edited
      if (e.target.closest('.btn-history, .btn-edit, .copy, a')) return;
      card.classList.toggle('is-open');
      syncFolds(card, true);
    });
  });

  document.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      enterEdit(btn.dataset.edit);
    });
  });

  document.querySelectorAll('.section-head .left').forEach(btn => {
    btn.addEventListener('click', () => {
      const section = btn.closest('.section');
      if (!section.querySelector('.section-body')) return;
      const open = section.classList.toggle('is-open');
      btn.querySelector('use').setAttribute('href', open ? '#i-chevron-up-sec' : '#i-chevron-down-sec');
      section.querySelector('.section-body').style.display = open ? '' : 'none';
      syncFolds(btn.closest('.card'), true);
    });
  });

  document.querySelectorAll('.pid .copy').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      navigator.clipboard?.writeText(btn.closest('.card').dataset.pid);
    });
  });
}

/* toggles in the filter bar */
document.querySelectorAll('[data-switch]').forEach(sw => {
  const flip = () => {
    const on = sw.classList.toggle('is-on');
    sw.setAttribute('aria-checked', String(on));
  };
  sw.addEventListener('click', flip);
  sw.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
  });
});

/* segmented controls */
document.querySelectorAll('.btn-group').forEach(group => {
  group.querySelectorAll('.btn-group-base').forEach(b => {
    b.addEventListener('click', () => {
      group.querySelectorAll('.btn-group-base').forEach(x => x.classList.remove('is-active'));
      b.classList.add('is-active');
    });
  });
});

/* boot */
renderCards();
updateEdited();
document.fonts.ready.then(() => syncAll(false));
window.addEventListener('resize', () => syncAll(false));
</script>
</body>
</html>
