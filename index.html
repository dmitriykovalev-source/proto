  :root{
    /* Colors */
    --gray-0:#ffffff;
    --gray-100:#f8fafe;
    --gray-200:#e4e7f0;
    --gray-300:#ced4e1;
    --gray-400:#98a2b8;
    --gray-500:#69728b;
    --gray-900:#000000;
    --border-primary:#e4e7f0;
    --bg-white:#ffffff;
    --bg-gray-light:#f8fafe;
    --bg-active:#f9fafb;
    --brand-purple:#5145bf;
    --brand-lightgray:#f4f5fd;
    --purple-600:#7765ec;
    --purple-700:#633ee5;
    --purple-soft:#f4f2fe;
    --purple-border:#dcd6fb;
    --text-link:#8377f1;
    --red-50:#fef3f2;
    --red-200:#fecdca;
    --red-600-badge:#d92d20;
    --red-600:#ee1b2e;
    --green-600:#12a150;
    --yellow-50:#fffaeb;
    --yellow-100:#fef0c7;
    --yellow-200:#fedf89;
    --yellow-500:#f5c211;
    --yellow-800:#93701a;
    /* Spacing */
    --s-4:4px;  --s-6:6px;  --s-8:8px;  --s-12:12px; --s-16:16px;
    --s-20:20px; --s-24:24px; --s-28:28px; --s-32:32px;
    /* Radius */
    --r-4:4px; --r-8:8px; --r-12:12px; --r-16:16px; --r-full:9999px;
    /* Type */
    --ff:"Work Sans Cyrillic","Work Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
    --fw-regular:440;
    --fw-medium:520;
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--gray-0);
    color:var(--gray-900);
    font-family:var(--ff);
    font-weight:var(--fw-regular);
    font-size:14px;
    line-height:20px;
    font-feature-settings:"ss02" 1,"ss04" 1,"case" 1,"liga" 0;
    -webkit-font-smoothing:antialiased;
  }
  p{margin:0}
  .icon{display:block;flex:none}
  .sprite{position:absolute;width:0;height:0;overflow:hidden}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--gray-300);border:3px solid transparent;background-clip:content-box;border-radius:9px}

  /* ---------- page shell ---------- */
  .page{width:1600px;margin:0 auto;padding:40px 130px 0 126px}
  .stack{display:flex;flex-direction:column;gap:var(--s-16)}

  /* ---------- Page / Header (top tabs) ---------- */
  .page-header{background:var(--gray-0)}
  .page-header .wrapper{display:flex;gap:8px;height:40px;align-items:flex-start}
  .htabs{display:flex;gap:var(--s-4);align-items:center}
  .tab-base{
    display:flex;gap:var(--s-8);align-items:center;justify-content:center;
    height:40px;padding:var(--s-8) var(--s-12);border-radius:var(--r-4);
    font-weight:var(--fw-medium);font-size:14px;line-height:20px;
    color:var(--gray-400);white-space:nowrap;cursor:pointer;
    border:0;background:transparent;font-family:inherit;
  }
  .tab-base.is-active{background:var(--brand-lightgray);color:var(--brand-purple)}
  .tab-base.is-muted{color:#959595}
  .tab-badge{
    display:flex;align-items:center;padding:1px var(--s-8) 3px;
    background:var(--red-50);box-shadow:inset 0 0 0 1px var(--red-200);
    border-radius:var(--r-full);
    font-family:"Aeroport",var(--ff);font-weight:500;font-size:12px;line-height:16px;
    color:var(--red-600-badge);text-align:center;
    font-feature-settings:normal;
  }

  /* ---------- Tabs row (Overview / Positions + Export) ---------- */
  .tabs-row{display:flex;align-items:center;justify-content:space-between;height:40px}
  .btn-group{
    display:flex;align-items:stretch;border-radius:var(--r-8);overflow:hidden;
    box-shadow:inset 0 0 0 1px var(--border-primary),0 1px 2px 0 rgba(16,24,40,.05);
  }
  .btn-group-base{
    display:flex;gap:var(--s-8);align-items:center;justify-content:center;
    min-height:40px;padding:var(--s-8) var(--s-16) var(--s-8) 14px;
    background:var(--gray-0);border:0;box-shadow:inset -1px 0 0 0 var(--border-primary);
    font-family:inherit;font-weight:var(--fw-medium);font-size:14px;line-height:20px;
    color:var(--gray-900);white-space:nowrap;cursor:pointer;
  }
  .btn-group-base:last-child{box-shadow:none}
  .btn-group-base.is-active{background:var(--bg-active);color:var(--purple-700)}
  .btn{
    display:flex;gap:var(--s-4);align-items:center;justify-content:center;
    background:var(--bg-white);box-shadow:inset 0 0 0 1px var(--border-primary);
    border:0;border-radius:var(--r-8);font-family:inherit;
    font-weight:var(--fw-medium);font-size:14px;line-height:20px;
    color:var(--gray-900);white-space:nowrap;cursor:pointer;
  }
  .btn-export{width:108px;height:40px;padding:10px 16px}
  .btn-primary{background:var(--purple-700);color:#fff;box-shadow:none}
  .btn-primary:hover{background:var(--brand-purple)}
  .btn:disabled,.btn.is-off{
    background:var(--brand-lightgray);color:var(--gray-400);
    box-shadow:none;cursor:default;
  }
  .btn-primary:disabled{background:var(--brand-lightgray);color:var(--gray-400)}

  /* ---------- Planning-mode banner ---------- */
  .plan-banner{
    background:var(--bg-gray-light);box-shadow:inset 0 0 0 1px var(--border-primary);
    border-radius:var(--r-12);padding:var(--s-24);
    display:flex;align-items:center;justify-content:space-between;gap:var(--s-16);
  }
  .plan-banner .l{display:flex;flex-direction:column;gap:var(--s-4)}
  .plan-banner .t{font-weight:var(--fw-medium);font-size:20px;line-height:28px;color:var(--gray-900)}
  .plan-banner .t .done{color:var(--purple-700)}
  .plan-banner .s{display:flex;gap:var(--s-6);align-items:center;font-size:14px;line-height:20px;color:var(--gray-500)}
  .plan-banner .s .info{color:var(--gray-400)}
  .plan-banner .acts{display:flex;gap:var(--s-8);align-items:center}
  .btn-md{height:40px;padding:10px var(--s-16);gap:var(--s-8)}

  /* ---------- Filters ---------- */
  .filters{
    background:var(--bg-gray-light);box-shadow:inset 0 0 0 1px var(--border-primary);
    border-radius:var(--r-12);padding:var(--s-16) 0;
    display:flex;flex-direction:column;gap:var(--s-8);
  }
  .filters .controls{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 var(--s-16);
  }
  .filters .left{display:flex;gap:var(--s-12);align-items:center}
  .selects{display:flex;gap:8px;align-items:center}
  .select{
    display:flex;gap:var(--s-8);align-items:center;
    background:var(--gray-0);box-shadow:inset 0 0 0 1px var(--border-primary);
    border-radius:8px;padding:var(--s-8) 12px;cursor:pointer;
  }
  .select .val{
    flex:1 0 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:14px;line-height:20px;color:var(--gray-900);
  }
  .select .val .count{color:var(--gray-400)}
  .btn-ghost{
    display:flex;gap:8px;align-items:center;justify-content:center;
    width:100px;height:36px;padding:4px var(--s-12);border:0;background:transparent;
    border-radius:var(--r-8);font-family:inherit;
    font-weight:var(--fw-medium);font-size:14px;line-height:20px;
    color:var(--purple-700);white-space:nowrap;cursor:pointer;
  }
  .filters .right{display:flex;gap:var(--s-20);align-items:center}
  .switchers{display:flex;gap:var(--s-16);align-items:center}
  .switcher{display:flex;gap:var(--s-6);align-items:flex-start;cursor:pointer;user-select:none}
  .switcher .ui{position:relative;width:26px;height:20px;flex:none}
  .switcher .track{
    position:absolute;left:0;top:3px;width:26px;height:14px;
    border-radius:8px;background:var(--gray-200);transition:background .16s ease;
  }
  .switcher .knob{
    position:absolute;left:3px;top:6px;width:10px;height:8px;border-radius:5px;
    background:#fff;box-shadow:0 2px 2px 0 rgba(215,215,215,.2);
    transition:left .16s ease;
  }
  .switcher.is-on .track{background:var(--purple-600)}
  .switcher.is-on .knob{left:13px;box-shadow:none}
  .switcher .label{font-size:14px;line-height:20px;color:var(--gray-900)}
  .unit-group{height:36px}
  .unit-group .btn-group-base{min-height:40px;padding:var(--s-8) var(--s-16);gap:4px}
  .unit-group .btn-group-base.is-active{background:var(--gray-100);color:var(--purple-700)}
  .btn-square{
    width:36px;height:36px;padding:0;border-radius:var(--r-8);
    display:flex;align-items:center;justify-content:center;
    background:var(--bg-white);box-shadow:inset 0 0 0 1px var(--border-primary);border:0;cursor:pointer;
  }

  /* ---------- editing locks the surrounding screen ---------- */
  /* nothing in the filter bar can be acted on with a form open — the whole bar goes */
  body.is-editing .filters{display:none}
  /* everything that would take you off the position is switched off, not hidden */
  body.is-editing .tabs-row .btn-group{pointer-events:none;box-shadow:inset 0 0 0 1px var(--border-primary)}
  body.is-editing .tabs-row .btn-group-base{background:var(--brand-lightgray);color:var(--gray-400)}
  body.is-editing .btn-export,
  body.is-editing .plan-banner .acts .btn{
    pointer-events:none;cursor:default;
    background:var(--brand-lightgray);color:var(--gray-400);box-shadow:none;
  }

  /* ---------- Work area: list + changes panel ---------- */
  .work{display:flex;gap:var(--s-16);align-items:flex-start}
  /* a real border, not an inset shadow — the white cards inside would paint over it */
  .list{
    flex:1 1 auto;min-width:0;
    background:var(--bg-white);border:1px solid var(--border-primary);
    border-radius:var(--r-12);overflow:hidden;
  }

  /* list header row */
  .list-head{
    position:relative;display:flex;gap:239px;align-items:center;
    padding:12px var(--s-24);background:var(--bg-white);
  }
  .list-head .lh-left{width:398px;height:20px;overflow:hidden}
  .list-head .lh-right{position:relative;flex:1 0 0;min-width:0;display:flex;align-items:center;justify-content:space-between}
  .th{font-weight:var(--fw-medium);font-size:12px;line-height:20px;color:var(--gray-400);white-space:nowrap}
  .th-type{width:140px}
  .th-num{width:65px;text-align:right}
  .th-extra{width:66px;text-align:right}
  .th-bonus{display:flex;gap:var(--s-4);align-items:center;justify-content:flex-end;width:65px}
  .th-bonus .th{width:39px;text-align:right}
  .list-head .bonus-icon{position:absolute;left:392px;top:2px;color:var(--gray-300)}
  .list-head .vsep{position:absolute;left:632px;top:1px;width:1px;height:43px;background:var(--border-primary)}

  /* ---------- Card ---------- */
  .card{position:relative;display:flex;flex-direction:column;background:var(--bg-white)}
  .card .row-sep{
    position:absolute;left:0;top:0;height:1px;width:100%;
    background:var(--border-primary);transition:left .28s ease,right .28s ease;right:0;
  }
  .card.is-open .row-sep,.card.is-editing .row-sep{left:7px;right:7px}
  .card .accent{
    position:absolute;left:1px;top:0;bottom:0;width:6px;
    background:var(--gray-400);border-radius:var(--r-4) 0 0 var(--r-4);
    opacity:0;transition:opacity .22s ease,background .22s ease;pointer-events:none;
  }
  .card.is-open .accent{opacity:1}
  .card.is-editing .accent{opacity:1;background:var(--purple-600)}

  .card-top{
    display:flex;align-items:center;justify-content:space-between;
    padding:var(--s-24) var(--s-24) var(--s-8);background:var(--bg-white);
  }
  .card-top .l{display:flex;gap:var(--s-16);align-items:center}
  .pid{display:flex;gap:4px;align-items:center}
  .pid .num{font-weight:var(--fw-medium);font-size:14px;line-height:20px;color:var(--gray-400);white-space:nowrap;font-feature-settings:"ss02" 1,"ss04" 1}
  .pid .copy{color:var(--gray-300);border:0;background:transparent;padding:0;cursor:pointer;line-height:0}
  .badges{display:flex;gap:var(--s-6);align-items:center}
  .badge{
    display:flex;gap:var(--s-4);align-items:center;justify-content:center;
    padding:var(--s-4) var(--s-12);background:var(--bg-gray-light);
    box-shadow:inset 0 0 0 1px var(--border-primary);border-radius:var(--r-16);
    font-size:14px;line-height:20px;color:var(--gray-500);white-space:nowrap;
  }
  .badge.is-edited{background:var(--purple-soft);box-shadow:inset 0 0 0 1px var(--purple-border);color:var(--purple-700)}
  .card-top .r{display:flex;gap:var(--s-8);align-items:center}
  .btn-history{width:100px;height:32px;padding:4px 12px;gap:8px}
  .btn-edit{height:32px;padding:4px var(--s-12);gap:8px}
  .btn-chevron{
    width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg-white);box-shadow:inset 0 0 0 1px var(--border-primary);
    border:0;border-radius:var(--r-8);overflow:hidden;cursor:pointer;
  }
  .btn-chevron .icon{transition:transform .28s ease}
  .card.is-open .btn-chevron .icon{transform:rotate(180deg)}
  /* editing tag replaces the row controls on the card being edited */
  .editing-tag{
    display:none;gap:var(--s-6);align-items:center;height:32px;padding:0 var(--s-12);
    background:var(--purple-soft);box-shadow:inset 0 0 0 1px var(--purple-border);
    border-radius:var(--r-16);font-weight:var(--fw-medium);font-size:14px;line-height:20px;
    color:var(--purple-700);white-space:nowrap;
  }
  .card.is-editing .editing-tag{display:flex}
  .card.is-editing .btn-history,
  .card.is-editing .btn-edit,
  .card.is-editing .btn-chevron{display:none}
  /* while one card is being edited, no other card offers Edit or History — but they still open */
  body.is-editing .card:not(.is-editing) .btn-edit{display:none}
  body.is-editing .btn-history{display:none}

  /* accordion mechanics — heights are driven from JS so the swap can animate */
  .card-body{display:flex;flex-direction:column}
  .fold{overflow:hidden;transition:height .28s ease}
  .fold-expanded,.fold-edit{height:0}

  .card-bottom{
    display:flex;gap:var(--s-28);align-items:flex-start;
    padding:var(--s-12) var(--s-24) var(--s-24);background:var(--bg-white);
  }
  .vsep{width:1px;flex:none;background:var(--border-primary)}
  .vsep-48{height:48px}
  .vsep-stretch{align-self:stretch}

  /* employee block */
  .person{display:flex;gap:var(--s-12);align-items:center}
  .person .pic{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;display:block}
  /* stand-ins for the people with no photo: initials, and a silhouette for a vacancy */
  .person .pic-init,.person .pic-ph{
    width:48px;height:48px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .person .pic-init{background:var(--purple-soft);color:var(--purple-700);font-weight:var(--fw-medium);font-size:16px;line-height:24px}
  .person .pic-ph{background:var(--brand-lightgray);color:var(--gray-400)}
  .person .txt{display:flex;flex-direction:column;min-width:0;white-space:nowrap;color:var(--gray-900)}
  .person .name{font-weight:var(--fw-medium);font-size:16px;line-height:24px;font-feature-settings:"ss02" 1,"ss04" 1;overflow:hidden;text-overflow:ellipsis}
  .person .role{font-size:14px;line-height:20px;overflow:hidden;text-overflow:ellipsis}
  .person .name.is-vacancy{display:flex;gap:var(--s-8);align-items:baseline}
  .person .name .muted{color:var(--gray-400)}
  .person .name .dot{color:var(--gray-400)}

  .cell-user{width:580px;display:flex;align-items:flex-start;flex:none}
  .card-left{width:580px;flex:none;display:flex;flex-direction:column;gap:var(--s-16)}

  /* money block */
  .money{flex:1 0 0;min-width:0;display:flex;flex-direction:column;gap:var(--s-32);overflow:hidden}
  .money-part{display:flex;flex-direction:column;gap:12px;width:100%}
  .money-cap{font-weight:var(--fw-medium);font-size:12px;line-height:20px;color:var(--gray-500);white-space:nowrap}
  .data{display:flex;align-items:center;justify-content:space-between;width:100%}
  .col-title{
    width:122px;flex:none;display:flex;flex-direction:column;gap:var(--s-8);
    align-items:flex-start;font-size:14px;line-height:20px;color:var(--gray-400);white-space:nowrap;
  }
  .col-val{
    width:65px;flex:none;display:flex;flex-direction:column;gap:var(--s-8);
    align-items:flex-end;font-size:14px;line-height:20px;color:var(--gray-900);white-space:nowrap;
  }
  .col-val .neg{color:var(--red-600)}
  .title-inline{display:flex;gap:var(--s-4);align-items:center}
  .title-inline .info{color:var(--gray-300)}

  /* money effect — takes the place of the Budget / Fact columns while editing */
  .card.is-editing .fold-collapsed .money,
  .card.is-editing .fold-collapsed .vsep-48{display:none}
  .card.is-editing .fold-collapsed .card-bottom{align-items:center}   /* level with the avatar */
  .fx[hidden]{display:none}
  .fx{
    flex:1 0 0;min-width:0;
    display:flex;align-items:center;gap:var(--s-32);flex-wrap:wrap;
  }
  .fx-t{display:flex;flex-direction:column;gap:2px;white-space:nowrap}
  .fx-l{font-size:12px;line-height:20px;color:var(--gray-400)}
  .fx-v{
    display:flex;gap:var(--s-8);align-items:baseline;
    font-weight:var(--fw-medium);font-size:16px;line-height:24px;color:var(--gray-900);
    font-feature-settings:"ss02" 1,"ss04" 1;
  }
  .fx-s{font-weight:var(--fw-medium);font-size:12px;line-height:18px;color:var(--gray-400);font-feature-settings:"ss02" 1,"ss04" 1}
  .fx-v.over,.fx-s.over{color:var(--red-600)}
  .fx-v.good,.fx-s.good{color:var(--green-600)}

  /* ---------- Back to edit ---------- */
  .back-to-edit{
    position:fixed;left:50%;bottom:var(--s-24);transform:translateX(-50%);
    height:44px;padding:12px var(--s-20);gap:var(--s-8);z-index:15;
    background:var(--purple-700);color:#fff;box-shadow:0 8px 24px rgba(53,38,140,.28);
  }
  .back-to-edit:hover{background:var(--brand-purple)}
  .back-to-edit[hidden]{display:none}

  /* collapsible sections in expanded card */
  .section{display:flex;flex-direction:column;gap:8px;width:100%}
  .section-head{display:flex;gap:var(--s-12);align-items:center;width:100%}
  .section-head .left{
    display:flex;gap:4px;align-items:center;border:0;background:transparent;padding:0;
    font-family:inherit;font-weight:var(--fw-medium);font-size:12px;line-height:20px;
    color:var(--gray-500);white-space:nowrap;cursor:pointer;
  }
  .section-head .left .icon{color:var(--gray-500)}
  .section-head .rule{flex:1 0 0;min-width:0;height:1px;background:transparent}
  .section.is-open .section-head .rule{background:var(--border-primary)}
  .section-body{display:flex;gap:var(--s-24);align-items:flex-start}
  .section-col{display:flex;flex-direction:column;gap:var(--s-8)}
  .field{display:flex;flex-direction:column;width:276px}
  .field .lbl{font-size:12px;line-height:20px;color:var(--gray-400);font-feature-settings:"ss02" 1,"ss04" 1}
  .field .v{font-size:14px;line-height:20px;color:var(--gray-900);white-space:nowrap}
  .field .v a{color:var(--text-link);text-decoration:none}

  /* ---------- Edit form inside the card ---------- */
  /* form on the left, the changes panel on the right — both inside the card */
  .edit-wrap{
    display:flex;gap:var(--s-24);align-items:flex-start;
    padding:var(--s-12) var(--s-24) var(--s-24);background:var(--bg-white);
  }
  .edit-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:var(--s-24)}
  .edit-side{flex:none;width:330px}
  /* the person / money row stays put above the form, so it loses its bottom air */
  .card.is-editing .fold-collapsed .card-bottom{padding-bottom:var(--s-12)}

  /* one apply month for the whole session */
  .month-row{
    display:flex;gap:var(--s-12);align-items:center;flex-wrap:wrap;
    background:var(--purple-soft);border-radius:var(--r-12);
    padding:var(--s-12) var(--s-16);
  }
  .month-row .ml{font-weight:var(--fw-medium);font-size:14px;line-height:20px;color:var(--gray-900);white-space:nowrap}
  .month-row .inp{width:auto;min-width:150px;background:var(--bg-white)}
  .month-row .mn{flex:1 1 200px;min-width:0;font-size:12px;line-height:18px;color:var(--gray-500)}
  .esec{display:flex;flex-direction:column;gap:var(--s-12);width:100%}
  .esec-h{
    display:flex;gap:var(--s-12);align-items:center;width:100%;
    padding:0;border:0;background:transparent;font-family:inherit;cursor:pointer;text-align:left;
  }
  .esec-h .cap{
    display:flex;gap:var(--s-6);align-items:baseline;
    font-weight:var(--fw-medium);font-size:12px;line-height:20px;color:var(--gray-500);white-space:nowrap;
  }
  .esec-h .cap .n{color:var(--gray-300)}
  .esec-h .rule{flex:1 0 0;min-width:0;height:1px;background:var(--border-primary)}
  .esec-h .chev{color:var(--gray-400);transition:transform .22s ease}
  .esec.is-open .esec-h .chev{transform:rotate(180deg)}
  .esec-h:hover .cap{color:var(--gray-900)}
  .esec-count{
    display:flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 var(--s-6);
    background:var(--purple-soft);border-radius:var(--r-full);
    font-weight:var(--fw-medium);font-size:12px;line-height:20px;color:var(--purple-700);
  }
  .esec:not(.is-open) .esec-body{display:none}
  .egrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-4) var(--s-24)}

  .efld{
    display:flex;flex-direction:column;gap:var(--s-4);min-width:0;
    padding:var(--s-8) var(--s-12);border-left:3px solid transparent;border-radius:var(--r-8);
    transition:background .16s ease,border-color .16s ease,box-shadow .2s ease;
  }
  .efld.wide{grid-column:1 / -1}
  .efld.is-changed{border-left-color:var(--purple-600);background:var(--purple-soft)}
  .efld.is-hit{box-shadow:0 0 0 2px var(--purple-600)}
  .efld.is-orphan{background:var(--bg-gray-light);border-left-color:var(--gray-300)}
  .efld.after-tr{background:var(--red-50);border-left-color:var(--red-600)}
  .efld.after-tr .ehint{color:var(--red-600)}
  .efld-c{display:flex;flex-direction:column;gap:var(--s-4);min-width:0}
  .efld .lbl{
    display:flex;gap:var(--s-4);align-items:center;
    font-size:12px;line-height:20px;color:var(--gray-400);font-feature-settings:"ss02" 1,"ss04" 1;
  }
  .oq{
    display:inline-flex;align-items:center;height:16px;padding:0 5px;border-radius:var(--r-full);
    border:1px dashed var(--purple-border);background:var(--purple-soft);color:var(--purple-700);
    font-size:10px;line-height:14px;cursor:help;
  }

  /* controls, in the card design language */
  .inp{
    width:100%;max-width:340px;height:36px;padding:var(--s-8) var(--s-12);
    font-family:inherit;font-weight:var(--fw-regular);font-size:14px;line-height:20px;color:var(--gray-900);
    background:var(--bg-white);border:0;box-shadow:inset 0 0 0 1px var(--border-primary);
    border-radius:var(--r-8);outline:none;
    transition:box-shadow .14s ease;
  }
  select.inp{
    appearance:none;-webkit-appearance:none;padding-right:32px;cursor:pointer;
    background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'%3E%3Cpath d='M4 6.5L8 10.5L12 6.5' fill='none' stroke='%2398a2b8' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 10px center;
  }
  textarea.inp{height:64px;max-width:100%;resize:vertical;line-height:20px}
  .inp:focus{box-shadow:inset 0 0 0 1px var(--purple-600),0 0 0 3px rgba(119,101,236,.16)}
  .inp:disabled{background:var(--bg-gray-light);color:var(--gray-400);cursor:default}
  .inp-sm{height:28px;padding:var(--s-4) var(--s-8);font-size:12px;line-height:20px;border-radius:var(--r-8);width:auto;max-width:none}
  select.inp-sm{padding-right:26px;background-position:right 6px center}

  .radios{display:flex;gap:var(--s-16);flex-wrap:wrap;align-items:center;min-height:36px}
  .radios label,.chk label{display:flex;gap:var(--s-6);align-items:center;cursor:pointer;font-size:14px;line-height:20px}
  .chk{display:flex;align-items:center;min-height:36px}
  input[type=checkbox],input[type=radio]{accent-color:var(--purple-600);width:16px;height:16px;margin:0}

  .emeta{
    display:flex;flex-wrap:wrap;gap:var(--s-6) var(--s-12);align-items:center;
    margin-top:var(--s-4);font-size:12px;line-height:20px;color:var(--gray-500);
  }
  .emeta .apply{display:flex;gap:var(--s-6);align-items:center}
  .emeta label{display:flex;gap:var(--s-6);align-items:center;cursor:pointer;color:var(--gray-900);font-size:14px;line-height:20px}
  .ehint{color:var(--gray-400)}
  .ecalc{color:var(--gray-500);font-feature-settings:"ss02" 1,"ss04" 1}
  /* the control and its revert sit on one line */
  .ctrl-row{display:flex;gap:var(--s-8);align-items:center;min-width:0}
  .ctrl-row > .inp{flex:1 1 auto}
  .revert{
    width:32px;height:32px;flex:none;padding:0;border:0;border-radius:var(--r-8);
    display:flex;align-items:center;justify-content:center;
    background:transparent;color:var(--gray-400);cursor:pointer;
  }
  .revert:hover{background:var(--red-50);color:var(--red-600)}
  .effect{margin-top:var(--s-4);font-size:12px;line-height:18px;color:var(--gray-400);max-width:620px}
  .effect:empty{display:none}

  /* ---------- Changes panel, inside the card ---------- */
  .chg-panel{
    display:flex;flex-direction:column;
    background:var(--bg-white);border:1px solid var(--border-primary);
    border-radius:var(--r-12);overflow:hidden;
  }
  .pnl-scroll{display:flex;flex-direction:column}
  .pnl-h{
    display:flex;align-items:baseline;gap:var(--s-8);
    padding:var(--s-16) var(--s-16) var(--s-4);
    font-weight:var(--fw-medium);font-size:16px;line-height:24px;color:var(--gray-900);
  }
  .link-btn{
    margin-left:auto;border:0;background:transparent;padding:2px 4px;border-radius:var(--r-4);
    font-family:inherit;font-weight:var(--fw-medium);font-size:12px;line-height:20px;
    color:var(--purple-700);cursor:pointer;
  }
  .link-btn:hover{background:var(--brand-lightgray)}
  .pnl-sum{
    display:flex;align-items:center;gap:var(--s-6);
    padding:0 var(--s-16) var(--s-12);border-bottom:1px solid var(--border-primary);
    font-size:12px;line-height:20px;color:var(--gray-400);
  }
  .pnl-sum label{margin-left:auto;display:flex;gap:var(--s-6);align-items:center;color:var(--gray-500);cursor:pointer;user-select:none}
  .pnl-sum input{width:14px;height:14px}
  .pnl-empty{
    padding:var(--s-12) var(--s-16);border-bottom:1px solid var(--border-primary);
    font-size:14px;line-height:20px;color:var(--gray-400);
  }
  .grp-h{
    padding:var(--s-12) var(--s-16) var(--s-6);
    font-weight:var(--fw-medium);font-size:12px;line-height:20px;color:var(--gray-400);
  }
  .chg{
    display:block;text-align:left;width:calc(100% - 16px);margin:0 var(--s-8) var(--s-8);
    background:var(--bg-white);box-shadow:inset 0 0 0 1px var(--border-primary);
    border:0;border-left:3px solid var(--purple-600);border-radius:var(--r-8);
    padding:var(--s-8) var(--s-12);cursor:pointer;font-family:inherit;
    transition:box-shadow .14s ease,background .14s ease;
  }
  .chg:hover{background:var(--bg-active);box-shadow:inset 0 0 0 1px var(--purple-border)}
  .chg-1{font-size:12px;line-height:20px;color:var(--gray-400)}
  .chg-2{
    font-weight:var(--fw-medium);font-size:14px;line-height:20px;color:var(--gray-900);
    word-break:break-word;font-feature-settings:"ss02" 1,"ss04" 1;
  }
  .chg-2 .ell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chg-when{font-size:12px;line-height:20px;color:var(--gray-400)}
  .chg-note{
    display:inline-block;margin-top:var(--s-4);padding:1px var(--s-8);
    background:var(--purple-soft);border-radius:var(--r-full);
    font-size:12px;line-height:18px;color:var(--purple-700);
  }
  /* another role's change — bright yellow, so it never reads as one of yours */
  .chg-other{
    border-left-color:var(--yellow-500);background:var(--yellow-50);
    box-shadow:inset 0 0 0 1px var(--yellow-200);cursor:default;
  }
  .chg-other:hover{background:var(--yellow-50);box-shadow:inset 0 0 0 1px var(--yellow-200)}
  .chg-other .chg-1{color:var(--yellow-800)}
  .chg-other .chg-2{color:var(--gray-900);font-weight:var(--fw-regular)}
  .chg-other .chg-src{color:var(--yellow-800);border-top-color:var(--yellow-200)}
  .chg-other .chg-note{color:var(--yellow-800);background:var(--yellow-100);box-shadow:none}
  .pnl-sum .dot-other{
    width:8px;height:8px;border-radius:var(--r-full);
    background:var(--yellow-500);flex:none;
  }
  .chg-src{
    margin-top:var(--s-6);padding-top:var(--s-6);border-top:1px solid var(--border-primary);
    font-size:12px;line-height:18px;color:var(--gray-400);
  }
  /* a change that acts on the whole position — it leads the list */
  .chg-struct{border-left-width:4px}
  .chg-key{
    display:inline-block;margin-bottom:var(--s-4);padding:0 var(--s-6);
    background:var(--gray-900);border-radius:var(--r-4);
    font-weight:var(--fw-medium);font-size:10px;line-height:16px;letter-spacing:.04em;
    text-transform:uppercase;color:#fff;
  }
  .chg-other .chg-key{background:var(--yellow-800)}
  .chg-cut{border-left-color:var(--gray-500)}
  .chg-cut-n{margin-top:var(--s-4);font-size:12px;line-height:18px;color:var(--gray-500)}
  .cut-line{display:flex;align-items:center;gap:var(--s-8);margin:0 var(--s-8) var(--s-8)}
  .cut-line::before,.cut-line::after{content:'';height:0;border-top:1px dashed var(--gray-300);flex:1 1 auto}
  .cut-line span{font-size:12px;line-height:18px;color:var(--gray-400);white-space:nowrap}
  .dead{
    margin:var(--s-12) var(--s-8) var(--s-4);padding:var(--s-8) 0 var(--s-4);
    background:var(--red-50);box-shadow:inset 0 0 0 1px var(--red-200);border-radius:var(--r-8);
  }
  .dead-h{
    display:flex;gap:var(--s-6);align-items:center;padding:0 var(--s-12);
    font-weight:var(--fw-medium);font-size:12px;line-height:20px;color:var(--red-600-badge);
  }
  .dead-mark{
    width:16px;height:16px;border-radius:var(--r-full);background:var(--red-600-badge);color:#fff;
    font-size:11px;line-height:16px;text-align:center;flex:none;
  }
  .dead-h .link-btn{color:var(--red-600-badge)}
  .dead-h .link-btn:hover{background:#fbdcdc}
  .dead-s{padding:var(--s-4) var(--s-12) var(--s-8);font-size:12px;line-height:18px;color:#9a6b6b}
  .chg.in-dead{border-left-color:#e0a0a0}
  .pnl-note{
    margin:var(--s-16) var(--s-16) var(--s-16);padding-top:var(--s-12);
    border-top:1px solid var(--border-primary);
    font-size:12px;line-height:18px;color:var(--gray-400);
  }
  /* a line about why, written before the changes go in */
  .pnl-comment{
    display:flex;flex-direction:column;gap:var(--s-4);
    padding:var(--s-12) var(--s-16);border-top:1px solid var(--border-primary);
  }
  .pnl-comment .lbl{
    display:flex;gap:var(--s-6);align-items:baseline;
    font-weight:var(--fw-medium);font-size:12px;line-height:20px;color:var(--gray-500);
  }
  .pnl-comment .lbl .opt{font-weight:var(--fw-regular);color:var(--gray-400)}
  .pnl-comment textarea{height:60px;font-size:14px}
  .pnl-actions{
    flex:none;border-top:1px solid var(--border-primary);
    padding:var(--s-12) var(--s-16) var(--s-16);background:var(--bg-white);
  }
  .pnl-state{margin-bottom:var(--s-8);font-size:14px;line-height:20px;color:var(--gray-900)}
  .pnl-state b{font-weight:var(--fw-medium)}
  .pnl-state-sub{display:block;font-size:12px;line-height:18px;color:var(--gray-400)}
  .pnl-actions-btns{display:flex;gap:var(--s-8)}
  .pnl-actions-btns .btn{flex:1 1 0;height:40px;padding:10px var(--s-12)}

  /* ---------- Warning text ---------- */
  .warning{
    display:flex;flex-direction:column;align-items:flex-end;
    padding:var(--s-8) 0 var(--s-28);
  }
  .warning p{width:100%;font-size:14px;line-height:20px;color:var(--gray-500)}
  .warning a{color:var(--purple-600);text-decoration:underline;text-underline-position:from-font}

  /* ---------- modal ---------- */
  .ovl{position:fixed;inset:0;background:rgba(24,24,38,.32);display:flex;align-items:center;justify-content:center;z-index:20}
  .ovl[hidden]{display:none}
  .dlg{
    width:540px;max-height:70vh;display:flex;flex-direction:column;
    background:#fff;border-radius:var(--r-12);box-shadow:0 18px 50px rgba(20,20,45,.22);
  }
  .dlg-h{padding:var(--s-16) var(--s-20);border-bottom:1px solid var(--border-primary);font-weight:var(--fw-medium);font-size:16px;line-height:24px}
  .dlg-b{padding:var(--s-16) var(--s-20);overflow-y:auto;font-size:14px;line-height:20px;color:var(--gray-500)}
  .dlg-b .ln{white-space:pre-wrap}
  .dlg-f{padding:var(--s-12) var(--s-20);border-top:1px solid var(--border-primary);display:flex;gap:var(--s-8);justify-content:flex-end}
  .dlg-f .btn{height:40px;padding:10px var(--s-16)}

  /* hover affordances (prototype) */
  .btn:not(:disabled):not(.is-off):hover,.btn-chevron:hover,.btn-square:hover{background:var(--bg-active)}
  .btn-primary:not(:disabled):hover{background:var(--brand-purple)}
  .card-top .l .pid .copy:hover{color:var(--gray-400)}
  .card[data-expandable] .card-top{cursor:pointer}
  .card.is-editing .card-top{cursor:default}
</style>
</head>

function monthList(from, to) {
  const out = []; let [y, m] = from.split('-').map(Number); const [ey, em] = to.split('-').map(Number);
  while (y < ey || (y === ey && m <= em)) { out.push(y + '-' + String(m).padStart(2, '0')); m++; if (m > 12) { m = 1; y++; } }
  return out;
}

function horizonVal(k) {
  if (isChanged(k)) return session[k].to;
  const ext = POS.existingChanges.filter(c => c.field === k).sort((a, b) => a.applyFrom < b.applyFrom ? -1 : 1).pop();
  return ext ? ext.to : attr(k);

function effState() {
  const pa = session.profileAction;
  if (pa && pa.to === 'remove') return 'open';
  if (pa && pa.to === 'set') return 'closed';
  return POS.state;

function fieldOrphaned(f) { return !!(f.only && f.only !== effState() && isChanged(f.k)); }

  if (f.bonus && !formVal('hasBonus')) return false;
  if (f.only && f.only !== effState()) return isChanged(f.k);
  return true;
}
function prevMonth(m) {

  mo--; if (mo < 1) { mo = 12; y--; }
  return y + '-' + String(mo).padStart(2, '0');

const foreignTransferMonth = () =>

/* ---------- the changes that stop everything else from landing ----------
   Transfer, deactivation and taking the profile off act on the position as a
   whole, so anything dated from that month on never reaches the budget. */
const STRUCTURAL = ['profileAction', 'deactivation', 'team'];

function blockers() {
  const out = [];
  if (isChanged('team')) {
    const t = TEAM(session.team.to);
    out.push({ key: 'team', month: session.team.applyFrom,
               text: 'the position moves to ' + (t ? t.manager.name : 'another manager') });
  }
  const foreign = POS.existingChanges.find(c => c.field === 'team');
  if (foreign) {
    const t = TEAM(foreign.to);
    out.push({ key: 'team', month: foreign.applyFrom,
               text: 'the position moves to ' + (t ? t.manager.name : 'another manager') });
  }
  if (isChanged('deactivation')) {
    out.push({ key: 'deactivation', month: session.deactivation.to, text: 'the position is switched off' });
  }
  const pa = session.profileAction;
  if (pa && pa.to === 'remove') {
    out.push({ key: 'profileAction', month: pa.applyFrom, text: 'the position loses its profile' });
  }
  return out.sort((a, b) => a.month < b.month ? -1 : 1);
}
/** The earliest one — everything from its month on is dead weight. */
const firstBlocker = () => blockers()[0] || null;

/** The month this position leaves your scope: yours if you transfer it, theirs otherwise. */
function transferMonth() {
  const ms = [];
  if (isChanged('team')) ms.push(session.team.applyFrom);
  const foreign = foreignTransferMonth();
  if (foreign) ms.push(foreign);
  return ms.sort()[0] || null;
}

function fillMonths(sel, limitMonth) {
  const limit = limitMonth || '';
  if (sel.dataset.limit === limit) return;
  sel.dataset.limit = limit;
  const cur = sel.value;
  sel.innerHTML = '';
  MONTHS.forEach(m => {
    const past = limit && m > limit;
    const o = el('option', '', fmtM(m) + (past ? ' — position transferred from ' + fmtM(limit) : ''));
    o.value = m; o.disabled = !!past;
    sel.appendChild(o);
  });
  if (cur) sel.value = cur;
}

/* ---------- money ----------
   One model for the whole screen: a bonus counts by its monthly share, so the
   list row, the strip on the card being edited and the field hints agree. */
const BONUS_KEYS = ['bonus.monthly', 'bonus.quarterly', 'bonus.semiAnnual', 'bonus.annual'];
const BONUS_PER_MONTH = { monthly: 1, quarterly: 3, semiAnnual: 6, annual: 12 };
function payAt(get) {
  const bonus = get('hasBonus')
    ? BONUS_KEYS.reduce((s, k) => s + (Number(get(k)) || 0) / BONUS_PER_MONTH[k.split('.')[1]], 0)
    : 0;
  return (Number(get('salary')) || 0) + bonus + (Number(get('extra')) || 0);
}
const rateOf = name => { const c = COMPANY(name); return c ? c.taxRate : POS.money.taxRate; };

/** Value carried by another role's change only — your session is left out. */
function otherVal(k) {
  const ext = POS.existingChanges.filter(c => c.field === k).sort((a, b) => a.applyFrom < b.applyFrom ? -1 : 1).pop();
  return ext ? ext.to : attr(k);
}
/* Budget — the plan. Forecast — with the changes other roles already made.
   Reforecast — with yours on top of theirs, at the end of the horizon. */
const budgetTotal     = () => payAt(attr)       * (1 + POS.money.taxRate);
const factTotal       = () => POS.state === 'open' ? null : budgetTotal();
const forecastTotal   = () => payAt(otherVal)   * (1 + rateOf(otherVal('company')));
const reforecastTotal = () => payAt(horizonVal) * (1 + rateOf(horizonVal('company')));

function fmtVal(k, v) {
  const f = F[k];
  if (v === null || v === undefined || v === '') return '—';
  if (k === 'team') { const t = TEAM(v); return t ? t.manager.name : String(v); }
  if (f && f.money) return num(v);
  if (f && f.pct) return v + '%';
  if (f && f.type === 'month') return fmtM(v);
  if (f && f.type === 'check') return v ? 'Yes' : 'No';
  return String(v);
}
const labelOf = k => (F[k] && F[k].label) || ({
  deactivation: 'Deactivation', 'profile.set': 'Set profile', profileAction: 'Profile action'
}[k] || k);

/* money as the list prints it: 1.234 with the currency in front */
const CUR = { USD: '$', EUR: '€', RUB: '₽', AED: 'AED ', RSD: 'RSD ' };
const cash = (v, cur) => (CUR[cur] || '') + new Intl.NumberFormat('de-DE').format(Math.round(v));

/* Budget / Fact for the compact row, on the same money model as the edit strip */
function cardMoneyRows(c){
  const a = c.attributes, cur = a.currency;
  if (a.salary == null) return [['—','—','—','—','—'], ['—','—','—','—','—']];
  const get = k => k.startsWith('bonus.') ? a.bonus[k.split('.')[1]] : a[k];
  const bonus = a.hasBonus
    ? BONUS_KEYS.reduce((s, k) => s + (Number(get(k)) || 0) / BONUS_PER_MONTH[k.split('.')[1]], 0)
    : 0;
  const pay = payAt(get);
  const rate = (COMPANY(a.company) || { taxRate: c.money.taxRate }).taxRate;
  const tax = pay * rate;
  const budget = [cash(pay + tax, cur), cash(a.salary, cur), cash(bonus, cur), cash(a.extra || 0, cur), cash(tax, cur)];
  // an open position has no fact yet
  const fact = c.state === 'open' ? ['—','—','—','—','—'] : budget;
  return [budget, fact];
}

function moneyBlock(caption, titles, rows){
  const cols = [0,1,2,3,4].map(i => {
    const cells = rows.map(row => {
      const cell = row[i];
      const txt  = typeof cell === 'object' ? cell.v : cell;
      const cls  = (typeof cell === 'object' && cell.neg) ? ' class="neg"' : '';
      return `<div${cls}>${txt}</div>`;
    }).join('');
    return `<div class="col-val">${cells}</div>`;
  }).join('');

  const titleRows = titles.map(t => typeof t === 'string'
    ? `<div>${t}</div>`
    : `<div class="title-inline"><span>${t.label}</span>${ICON('info-circle',16).replace('class="icon"','class="icon info"')}</div>`
  ).join('');

  return `
    <div class="money-part">
      ${caption ? `<p class="money-cap">${caption}</p>` : ''}
      <div class="data">
        <div class="col-title">${titleRows}</div>
        ${cols}
      </div>
    </div>`;
}
